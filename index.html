<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Mon Français · Des petits mondes</title>
  <meta name="description" content="Apprendre le français de petit monde en petit monde : chaque sujet est une petite planète, et chaque planète a son livre.">
  <meta name="theme-color" content="#1c2442">
  <meta property="og:title" content="Mon Français · Des petits mondes">
  <meta property="og:description" content="Chaque sujet est une petite planète, et chaque planète a son livre.">
  <meta property="og:type" content="website">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%231c2442'/%3E%3Ccircle cx='32' cy='38' r='17' fill='%23e8cfa2' stroke='%232b2436' stroke-width='2'/%3E%3Crect x='30' y='12' width='5' height='12' fill='%23ecd9b0'/%3E%3Cpath d='M28 12 L32.5 6 L37 12Z' fill='%23c8594b'/%3E%3Cpath d='M50 12 l1.5 3.5 3.5 1.5 -3.5 1.5 -1.5 3.5 -1.5 -3.5 -3.5 -1.5 3.5 -1.5z' fill='%23f3e6bf'/%3E%3C/svg%3E">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;0,700;1,500;1,600;1,700&family=EB+Garamond:ital,wght@0,400;0,500;0,600;1,400;1,500&display=swap">
  <link rel="stylesheet" href="assets/css/style.css?v=20">
  <link rel="stylesheet" href="assets/css/book.css?v=20">
  <link rel="stylesheet" href="assets/css/aquarelle.css?v=21">
  <script type="importmap">{ "imports": { "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js", "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/" } }</script>
</head>
<body class="home">
  <a class="skip-link" href="#main">Aller au contenu</a>
  <header id="site-header"></header>
  <main id="main"></main>
  <script src="assets/js/core.js?v=20"></script>
  <script src="assets/js/verbs.js?v=20"></script>
  <script src="topics/index.js?v=20"></script>
  <script src="assets/js/book.js?v=20"></script>
  <script>
    (function () {
      const B = FL.bi, esc = FL.esc;
      FL.renderHeader('home');
      FL.renderRoom();
      const worlds = FL.TOPICS.filter(t => t.world).map(t => ({ ...t.world, id: t.id, ready: !!t.ready, topic: t }));
      const main = document.getElementById('main');
      main.innerHTML = `
        <section class="sky" aria-labelledby="sky-title">
          <div class="sky-canvas" aria-hidden="true"></div>
          <div class="sky-intro">
            <p class="sky-kicker" lang="fr">Mon Français</p>
            <h1 id="sky-title" lang="fr">Un livre,<br>des petits mondes.</h1>
            <p class="sky-sub">${B('每个主题是一颗小星球，每颗星球有它自己的书。', 'Each topic is a small planet, and each planet has its own book.')}</p>
            <p class="sky-hint">${B('点一颗星球，打开它的书', 'Choose a planet to open its book')}</p>
          </div>
          <ol class="sky-labels">${worlds.map(w => `
            <li><a class="world-label ${w.ready ? '' : 'soon'}" data-world="${w.id}" href="${w.ready ? `topic.html?t=${w.id}` : '#'}" ${w.ready ? '' : 'aria-disabled="true"'}>
              <span class="wl-poster">${FL.planetPoster(w, { stars: false })}</span>
              <span class="wl-no" lang="fr">Petit monde n° ${w.no}</span>
              <b class="wl-name" lang="fr">${esc(w.fr)}</b>
              <span class="wl-topic"><span lang="fr">${esc(w.topic.fr)}</span> · ${B(w.zh, w.en)}</span>
              ${w.ready ? '' : `<span class="wl-soon">${B('即将开放', 'coming soon')}</span>`}
            </a></li>`).join('')}
          </ol>
        </section>`;
      const sky = main.querySelector('.sky');
      const go = w => { location.href = `topic.html?t=${w.id}`; };
      let view = null;
      // a label click flies to the planet first (when the 3D sky is running)
      main.querySelector('.sky-labels').addEventListener('click', e => {
        const a = e.target.closest('[data-world]');
        if (!a) return;
        const w = worlds.find(x => x.id === a.dataset.world);
        if (!w.ready) { e.preventDefault(); a.classList.remove('nudge'); void a.offsetWidth; a.classList.add('nudge'); return; }
        if (view) { e.preventDefault(); view.open(w.id); }
      });
      FL.withPlanet(P => {
        view = P.universe(sky.querySelector('.sky-canvas'), worlds, { onOpen: go, labelsEl: main.querySelector('.sky-labels') });
        if (view) sky.classList.add('is-3d');
      });
    })();
  </script>
  <script type="module" src="assets/js/planet.js?v=20"></script>
</body>
</html>
