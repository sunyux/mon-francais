<body>
  <a class="skip-link" href="#main">Aller au contenu</a>
  <header id="site-header"></header>
  <main id="main" class="wrap"></main>
  <footer class="site-footer">Mon Français · <span lang="fr">Bon courage !</span></footer>
  <script src="assets/js/core.js?v=8"></script>
  <script src="assets/js/verbs.js?v=8"></script>
  <script src="assets/js/book.js?v=8"></script>
  <script>
    (function () {
      const B = FL.bi, esc = FL.esc;
      FL.renderHeader('verbs');
      FL.renderRoom();
      const list = FL.verbs.list().sort((a, b) => a.replace(/^se /, '').localeCompare(b.replace(/^se /, ''), 'fr'));
      const main = document.getElementById('main');
      main.innerHTML = `
        <section class="hero topic-hero">
          <div class="hero-emoji">🔁</div>
          <h1 class="fr">Les verbes</h1>
          <p class="hero-sub">${B('动词变位表', 'Verb conjugation tables')}</p>
          <p class="hero-intro">${B('全站共用的动词库。现在时、复合过去时、未完成过去时、简单将来时。', 'The shared verb library for the whole site: present, passé composé, imparfait, futur simple.')}</p>
        </section>
        <div class="verb-page">
          <aside class="verb-list card">
            <input type="search" class="verb-search" placeholder="Chercher… 搜索 / search" aria-label="Search verbs">
            <ul>${list.map(v => `<li><button type="button" data-verb="${esc(v)}"><span lang="fr">${esc(v)}</span><small>${FL.m(FL.verbs.get(v))}</small></button></li>`).join('')}</ul>
          </aside>
          <div class="verb-detail card"></div>
        </div>`;
      const detail = main.querySelector('.verb-detail');
      const show = v => {
        if (!FL.verbs.get(v)) v = list[0];
        detail.innerHTML = FL.verbs.tableHTML(v);
        main.querySelectorAll('[data-verb]').forEach(b => b.classList.toggle('on', b.dataset.verb === v));
        history.replaceState(null, '', '#' + encodeURIComponent(v));
      };
      main.querySelector('.verb-list').addEventListener('click', e => {
        const b = e.target.closest('[data-verb]');
        if (b) { show(b.dataset.verb); if (window.innerWidth < 800) detail.scrollIntoView({ behavior: 'smooth' }); }
      });
      main.querySelector('.verb-search').addEventListener('input', e => {
        const q = FL.norm(e.target.value, true);
        main.querySelectorAll('.verb-list li').forEach(li => {
          li.hidden = q && !FL.norm(li.textContent, true).includes(q);
        });
      });
      show(decodeURIComponent(location.hash.slice(1)) || 'être');
    })();
  </script>
</body>
</html>
